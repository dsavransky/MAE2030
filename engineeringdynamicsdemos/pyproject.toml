[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "engineeringdynamicsdemos"
dynamic = ["version"]
requires-python = ">=3.11"
authors = [
  {name = "Dmitry Savransky", email = "ds264@cornell.edu"},
]
maintainers = [
  {name = "Dmitry Savransky", email = "ds264@cornell.edu"},
]
description = "Python demos/animations for Cornell MAE 2030 / Princeton MAE 206 (Engineering Dynamics)"
readme = "README.md"
license = "MIT"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "angutils>=1.0.0",
]

[project.optional-dependencies]
# Test-only: MATLAB Engine API for Python, used to compare ported functions'
# output against the original MATLAB source. The R2025b-compatible releases
# of matlabengine (25.1.x/25.2.x) support Python 3.9-3.12 only (not 3.13) -
# re-verify this pin against whichever MATLAB R2025b patch level is
# installed wherever these tests are run.
test = [
  "matlabengine==25.2.2",
]

[project.urls]
Homepage = "https://github.com/dsavransky/MAE2030"
Repository = "https://github.com/dsavransky/MAE2030"
Issues = "https://github.com/dsavransky/MAE2030/issues"

[tool.setuptools.dynamic]
version = {attr = "engineeringdynamicsdemos.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "D101", "D102", "D103", "D105", "D106", "D207", "D208", "D416", "D417", "D419"]
ignore = ["E741", "E731", "E203", "F401"]
fixable = ["ALL"]
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
